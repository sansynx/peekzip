  <view id="preview" viewBox="24 0 20 36"/>
  <view id="index-horizontal" viewBox="48 0 36 20"/>
  <view id="preview-horizontal" viewBox="48 24 36 20"/>
  <view id="teeth" viewBox="90 0 8 6"/>
  <view id="teeth-horizontal" viewBox="90 12 6 8"/>
  <defs>
    <linearGradient id="metal">
      <stop stop-color="#777d7d"/><stop offset=".28" stop-color="#f7f4e7"/>
      <stop offset=".56" stop-color="#d7d8ce"/><stop offset="1" stop-color="#919794"/>
