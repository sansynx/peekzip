<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 52">
  <title>British diesel shunter seen from above</title>
  <view id="blue-down" viewBox="0 0 24 52"/>
  <view id="red-down" viewBox="24 0 24 52"/>
  <view id="blue-right" viewBox="48 0 52 24"/>
  <view id="red-right" viewBox="48 24 52 24"/>
  <defs>
    <g id="shunter" stroke-linejoin="round">
      <!-- Chassis, running boards and buffers -->
      <path fill="#272b2a" d="M3 3h18v45H3zM2 0h5v4H2zm15 0h5v4h-5zM2 48h5v4H2zm15 0h5v4h-5z"/>
      <path fill="#696963" d="M4 16h2v27H4zm14 0h2v27h-2z"/>
      <!-- Wide cab at the rear and narrow, square-ended engine bonnet -->
      <rect x="2" y="3" width="20" height="15" rx="1.5" fill="currentColor" stroke="#252e2e"/>
      <path d="M3.5 5h17v7h-17z" fill="#545856" stroke="#363c3b"/>
      <path d="M5 6h14" stroke="#a4a397"/>
      <path fill="#c4d9d5" d="M4 14h5v2H4zm11 0h5v2h-5z"/>
      <rect x="6" y="17" width="12" height="26" rx="1" fill="currentColor" stroke="#29302f"/>
      <path d="M8 19v21" stroke="#fff" stroke-opacity=".4"/>
      <path d="M11 20h4v4h-4z" fill="#262e2e"/>
      <path d="M9 29h6m-6 3h6m-6 3h6" stroke="#1f2e31" stroke-width="1.4"/>
      <!-- The warning chevrons mark the leading end -->
      <path d="M3 41h18v6H3z" fill="#eac45c"/>
      <path d="m3 42 4 4 5-4 5 4 4-4" fill="none" stroke="#2a2e2c" stroke-width="2"/>
      <path d="M2 47h20v2H2z" fill="#843d33"/>
    </g>
  </defs>
  <g color="#32638e">
    <use href="#shunter"/>
    <use href="#shunter" transform="translate(48 24) rotate(-90)"/>
  </g>
  <g color="#a0473d">
    <use href="#shunter" x="24"/>
    <use href="#shunter" transform="translate(48 48) rotate(-90)"/>
  </g>
</svg>
