<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 52">
  <title>British tank engine with a brass chimney and driving wheels, seen from above</title>
  <view id="blue-down" viewBox="0 0 24 52"/>
  <view id="red-down" viewBox="24 0 24 52"/>
  <view id="blue-right" viewBox="48 0 52 24"/>
  <view id="red-right" viewBox="48 24 52 24"/>
  <defs>
    <g id="engine" stroke-linejoin="round">
      <!-- Driving wheels and polished coupling rods flank the side tanks -->
      <path fill="#282d30" d="M3 7h18v39H3z"/>
      <g fill="#353a3e" stroke="#141c23">
        <rect x="1" y="14" width="4" height="7" rx="2"/>
        <rect x="1" y="24" width="4" height="7" rx="2"/>
        <rect x="1" y="34" width="4" height="7" rx="2"/>
        <rect x="19" y="14" width="4" height="7" rx="2"/>
        <rect x="19" y="24" width="4" height="7" rx="2"/>
        <rect x="19" y="34" width="4" height="7" rx="2"/>
      </g>
      <path d="M2.5 17v21m19-21v21" stroke="#bcc1ba" stroke-width="1.3"/>
      <path d="M4 10h16v24H4z" fill="currentColor" stroke="#25323a"/>
      <!-- Firebox, cylindrical boiler and smokebox -->
      <rect x="7" y="11" width="10" height="31" rx="4" fill="currentColor" stroke="#202b32"/>
      <path d="M9 15v19" stroke="#fff" stroke-opacity=".47" stroke-width="1.5"/>
      <path d="M7 22h10m-10 8h10" stroke="#272f32" stroke-width="1.6"/>
      <circle cx="12" cy="17.5" r="2.7" fill="#d1a45f" stroke="#493c2c"/>
      <path d="M7 34h10v6a5 5 0 0 1-10 0z" fill="#343b3e"/>
      <circle cx="12" cy="38" r="4.3" fill="#e6bb69" stroke="#2a2924"/>
      <circle cx="12" cy="38" r="2.5" fill="#1d2329"/>
      <!-- Broad cab roof and front buffer beam identify opposite ends -->
      <path d="M2 3q10-4 20 0v9q-10 3-20 0z" fill="currentColor" stroke="#222e36" stroke-width="1.5"/>
      <path d="M4 4q8-2.5 16 0" fill="none" stroke="#fff" stroke-opacity=".65"/>
      <path d="M4 11h4m8 0h4" stroke="#c2dde0" stroke-width="2"/>
      <path d="M5 45v4m14-4v4" stroke="#282d30" stroke-width="3"/>
      <path d="M2 49h6m8 0h6" stroke="#272b2c" stroke-width="2.6"/>
      <path d="M2 44h20v2.5H2z" fill="#ad4638" stroke="#3a2c29"/>
      <circle cx="12" cy="44.5" r="1.6" fill="#fff1ad" stroke="#524837" stroke-width=".7"/>
    </g>
  </defs>
  <g color="#326696">
    <use href="#engine"/>
    <use href="#engine" transform="translate(48 24) rotate(-90)"/>
  </g>
  <g color="#a2413d">
    <use href="#engine" x="24"/>
    <use href="#engine" transform="translate(48 48) rotate(-90)"/>
  </g>
</svg>
